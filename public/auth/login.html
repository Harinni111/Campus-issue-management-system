<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Campus Issue Management System | Login</title>
  <link rel="stylesheet" href="/common/styles.css" />
</head>

<body class="auth-body">

  <div class="auth-container">

    <!-- SYSTEM TITLE -->
    <div class="system-header">
      <h1>Campus Issue Management System</h1>
      <p class="system-subtitle">
        Issue Logging & Monitoring Portal
      </p>
    </div>

    <!-- LOGIN CARD -->
    <div class="card auth-card">
      <h2 class="auth-title">Sign In</h2>
      <p class="text-muted">
        Use your organization credentials
      </p>

      <label>Username</label>
      <input id="username" placeholder="Enter username" />

      <label>Password</label>
      <input id="password" type="password" placeholder="Enter password" />

      <p id="error" class="error-text"></p>

      <button class="btn btn-primary full-width" onclick="login()">
        Sign In
      </button>

      <div class="auth-footer">
        <span class="text-muted">New employee?</span>
        <a href="/auth/signup.html">Create an account</a>
      </div>
    </div>

  </div>

  <script src="login.js"></script>
</body>
</html>
