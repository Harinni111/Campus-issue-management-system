<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Employee Signup</title>

  <!-- Global enterprise styles -->
  <link rel="stylesheet" href="/common/styles.css" />
</head>

<body>

  <div class="page" style="max-width:600px;">

    <div class="card">
      <h2>Employee Registration</h2>
      <p class="text-muted">
        Accounts require admin approval before login
      </p>

      <!-- USERNAME -->
      <label>Username</label>
      <input id="username" placeholder="Choose a unique username" />

      <!-- FIRST NAME -->
      <label>First Name</label>
      <input id="firstName" placeholder="First name" />

      <!-- LAST NAME -->
      <label>Last Name</label>
      <input id="lastName" placeholder="Last name" />

      <!-- DOB -->
      <label>Date of Birth</label>
      <input id="dob" type="date" />

      <!-- EMAIL -->
      <label>Email</label>
      <input id="email" type="email" placeholder="name@company.com" />

      <!-- ADDRESS (REQUIRED BY BACKEND) -->
      <label>Address</label>
      <textarea
        id="address"
        placeholder="Full residential address"
        rows="3"
      ></textarea>

      <!-- GENDER (REQUIRED BY BACKEND) -->
      <label>Gender</label>
      <select id="gender">
        <option value="">Select</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>

      <!-- DEPARTMENT -->
      <label>Department</label>
      <select id="department">
        <option value="">Select</option>
        <option value="IT">IT</option>
        <option value="Facilities">Facilities</option>
        <option value="HR">HR</option>
      </select>

      <!-- PASSWORD -->
      <label>Password</label>
      <input
        id="password"
        type="password"
        placeholder="Minimum 8 characters"
      />

      <!-- MESSAGE -->
      <p id="message" class="text-muted"></p>

      <!-- SUBMIT -->
      <button class="btn btn-primary" onclick="signup()">
        Submit Registration
      </button>

      <p class="text-muted" style="margin-top:12px;">
        Already registered?
        <a href="/auth/login.html">Sign in</a>
      </p>
    </div>

  </div>

  <script src="signup.js"></script>
</body>
</html>
